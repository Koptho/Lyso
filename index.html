<!DOCTYPE html>
<html lang="nn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyso</title>
    <meta
      name="description"
      content="Ei barnevenleg øvingsapp for å trekkje saman bokstavar til stavingar."
    />
    <meta name="theme-color" content="#ffd85f" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260414a" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="reward-panel" aria-live="polite">
          <h1 class="hero-title">Lyso</h1>

          <div class="buddy-wrap">
            <div class="buddy" id="buddy" aria-hidden="true">
              <div class="buddy-eye buddy-eye-left"></div>
              <div class="buddy-eye buddy-eye-right"></div>
              <div class="buddy-mouth"></div>
            </div>
            <p class="buddy-status sr-only" id="buddyStatus">Lyso ventar på hjelp.</p>
          </div>
        </div>
      </section>

      <section class="play-card">
        <div class="track-wrap">
          <p class="helper-banner sr-only" id="helperBanner" aria-live="polite">
            Trykk på den varme bokstaven og dra henne roleg mot vokalen.
          </p>
          <div class="track" id="track" aria-label="Dra bokstaven mot vokalen">
            <div class="glow-line" aria-hidden="true"></div>
            <div
              class="letter-tile consonant-tile"
              id="draggableLetter"
              role="slider"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-label="Dra første bokstav mot vokalen"
              tabindex="0"
            >
              <span class="letter-char" id="consonantChar">s</span>
            </div>

            <div class="letter-tile vowel-tile" id="vowelLetter">
              <div class="receiver-stars" id="receiverStars" aria-hidden="true"></div>
              <span class="letter-char" id="vowelChar">o</span>
            </div>
          </div>
        </div>

        <div class="success-card sr-only" id="successCard" aria-live="polite">
          <p class="success-title">Prøv å byggje stavinga</p>
          <p class="success-text" id="successText">
            Dra bokstaven sakte mot vokalen og sjå korleis ho blir til ei stavelse.
          </p>
          <p class="audio-note" id="audioNote">Denne versjonen er laga utan lydstøtte.</p>
        </div>
      </section>

      <section class="choices-card" aria-label="Komande stavingar">
        <div class="choices-list" id="choicesList"></div>
        <details class="config-panel">
          <summary>Vaksenmodus</summary>
          <label class="config-label" for="syllableInput">
            Skriv éi stavelse per linje. To bokstavar fungerer best, til dømes `ma`, `so`, `li`.
          </label>
          <textarea
            id="syllableInput"
            class="config-input"
            rows="8"
            spellcheck="false"
            autocapitalize="none"
            autocomplete="off"
            autocorrect="off"
          >so
ma
le
ni
ro</textarea>
          <div class="config-actions">
            <button class="sound-button" id="saveConfigButton" type="button">Lagre vekas stavingar</button>
            <button class="sound-button ghost" id="resetConfigButton" type="button">Tilbakestill standard</button>
          </div>
          <p class="config-status" id="configStatus" aria-live="polite">
            Standardpakka er aktiv.
          </p>
        </details>
      </section>
    </main>

    <script src="./app.js?v=20260414a"></script>
  </body>
</html>
